<!DOCTYPE html>
<html>
  <head>
    <title>Streaming Debug Test</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; }
      .log { background-color: #f5f5f5; padding: 10px; margin: 5px 0; border-radius: 3px; font-family: monospace; font-size: 12px; max-height: 400px; overflow-y: auto; }
      button { margin: 5px; padding: 8px 16px; }
    </style>
  </head>
  <body>
    <h1>Streaming Debug Test</h1>
    <p>Test the ReceiveMessages streaming endpoint directly.</p>

    <button onclick="testStreaming()">🚀 Test Streaming</button>
    <button onclick="stopStreaming()">🛑 Stop Streaming</button>

    <div id="log" class="log"></div>

    <script>
      let reader = null;
      let cancelled = false;

      function log(message) {
          const logDiv = document.getElementById('log');
          const timestamp = new Date().toLocaleTimeString();
          logDiv.innerHTML += `<div>[${timestamp}] ${message}</div>`;
          logDiv.scrollTop = logDiv.scrollHeight;
      }

      async function testStreaming() {
          log("🚀 Starting streaming test...");
          cancelled = false;

          try {
              const requestData = new Uint8Array([0x00, 0x00, 0x00, 0x00, 0x00]);

              const response = await fetch('http://localhost:8080/ledabeer.MessageService/ReceiveMessages', {
                  method: 'POST',
                  headers: {
                      'Content-Type': 'application/grpc-web+proto',
                      'X-Grpc-Web': '1',
                      'X-User-Agent': 'grpc-web-javascript/0.1',
                  },
                  body: requestData,
              });

              if (!response.ok) {
                  throw new Error(`HTTP ${response.status}: ${response.statusText}`);
              }

              log(`✅ Connected to streaming endpoint (HTTP ${response.status})`);
              log(`📡 Waiting for messages...`);

              // Handle streaming response
              if (response.body) {
                  reader = response.body.getReader();

                  try {
                      let messageCount = 0;
                      while (!cancelled) {
                          const { done, value } = await reader.read();
                          if (done) {
                              log(`🔚 Stream ended`);
                              break;
                          }

                          if (value && value.length > 0) {
                              messageCount++;
                              log(`📦 Received message ${messageCount}: ${value.length} bytes`);

                              // Show first few bytes as hex
                              const hex = Array.from(value.slice(0, Math.min(20, value.length)))
                                  .map(b => '0x' + b.toString(16).padStart(2, '0'))
                                  .join(' ');
                              log(`   Data: ${hex}${value.length > 20 ? '...' : ''}`);

                              // Try to decode as text (simplified)
                              try {
                                  const text = new TextDecoder().decode(value.slice(5)); // Skip gRPC frame header
                                  log(`   Decoded: ${text}`);
                              } catch (e) {
                                  log(`   (Could not decode as text)`);
                              }
                          }
                      }
                  } finally {
                      reader.releaseLock();
                      reader = null;
                  }
              } else {
                  log(`❌ No response body`);
              }
          } catch (error) {
              log(`❌ Error: ${error.message}`);
          }
      }

      function stopStreaming() {
          log("🛑 Stopping streaming...");
          cancelled = true;
          if (reader) {
              reader.cancel();
          }
      }

      // Auto-test on page load
      window.onload = function() {
          log("🎯 Streaming Debug Test Ready - Click 'Test Streaming' to start");
      };
    </script>
  </body>
</html>
