version: "3.8"

services:
  # Bootstrap node
  bootstrap:
    build: .
    container_name: ledabeer-bootstrap
    ports:
      - "4001:4001"
      - "50051:50051"
    environment:
      - NODE_ROLE=bootstrap
    networks:
      - ledabeer-network
    command: ["node", "--bootstrap", "--listen", "/ip4/0.0.0.0/tcp/4001"]

  # Alice node
  alice:
    build: .
    container_name: ledabeer-alice
    ports:
      - "4002:4002"
    environment:
      - NODE_ROLE=alice
      - BOOTSTRAP_HOST=bootstrap
      - BOOTSTRAP_PORT=4001
    networks:
      - ledabeer-network
    depends_on:
      - bootstrap
    command:
      [
        "node",
        "--listen",
        "/ip4/0.0.0.0/tcp/4002",
        "--bootstrap-host",
        "bootstrap",
        "--bootstrap-port",
        "4001",
      ]

  # Bob node
  bob:
    build: .
    container_name: ledabeer-bob
    ports:
      - "4003:4003"
    environment:
      - NODE_ROLE=bob
      - BOOTSTRAP_HOST=bootstrap
      - BOOTSTRAP_PORT=4001
    networks:
      - ledabeer-network
    depends_on:
      - bootstrap
    command:
      [
        "node",
        "--listen",
        "/ip4/0.0.0.0/tcp/4003",
        "--bootstrap-host",
        "bootstrap",
        "--bootstrap-port",
        "4001",
      ]

  # Charlie node
  charlie:
    build: .
    container_name: ledabeer-charlie
    ports:
      - "4004:4004"
    environment:
      - NODE_ROLE=charlie
      - BOOTSTRAP_HOST=bootstrap
      - BOOTSTRAP_PORT=4001
    networks:
      - ledabeer-network
    depends_on:
      - bootstrap
    command:
      [
        "node",
        "--listen",
        "/ip4/0.0.0.0/tcp/4004",
        "--bootstrap-host",
        "bootstrap",
        "--bootstrap-port",
        "4001",
      ]

  # Envoy proxy for gRPC-Web
  envoy:
    image: envoyproxy/envoy:v1.28-latest
    container_name: ledabeer-envoy
    ports:
      - "8080:8080"
      - "9901:9901"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
    networks:
      - ledabeer-network
    depends_on:
      - bootstrap
    command: /usr/local/bin/envoy -c /etc/envoy/envoy.yaml

networks:
  ledabeer-network:
    driver: bridge
